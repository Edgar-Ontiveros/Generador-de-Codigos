# docker-compose.yml — entorno de DESARROLLO.
#   api: FastAPI con reload en 8000 (monta ./data: ahí viven el export de SAP
#        y catalogo.db, para conservar las altas)
#   web: Vite dev server en 5173 con proxy de /api al backend
#
# Producción: usar el Dockerfile multi-stage (un solo contenedor en 8000).
services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - CATALOGO_DB=/app/data/catalogo.db
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python build_db.py data/BASE_DE_DATOS.xlsx data/catalogo.db &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://api:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api
